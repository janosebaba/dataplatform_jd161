[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "janosebaba-dataplatform_jd161"
version = "0.1.0"
description = "为每一项打分并与阈值比较，明确标出通过、边界与不通过三档"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "janosebaba" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://janosebaba.github.io"
Repository = "https://github.com/janosebaba/dataplatform_jd161"
Issues = "https://github.com/janosebaba/dataplatform_jd161/issues"

[project.scripts]
dataplatform_jd161 = "dataplatform_jd161:main"

[tool.setuptools]
py-modules = ["dataplatform_jd161"]
